# cc-tuner smoke-verify config (KEY=VALUE, parsed by bash — no quotes needed).
# Presence of this file opts THIS repo into the Stop-hook gate: a turn that
# changed files matching `patterns` cannot end until the change is empirically
# verified (or explicitly skipped) via scripts/smoke-verify/mark.sh.
#
# patterns: extended regex (grep -E) matched against `git status --porcelain`
# lines of changed files. Tune per repo — e.g. add |(^|/)app/.*\.tsx?$ for a
# Next.js app dir, or narrow to components/ only.
patterns=\.(tsx|jsx|vue|svelte|css|scss)$
# cap: max blocks per unchanged delta before the gate fails open (1-99).
cap=3
