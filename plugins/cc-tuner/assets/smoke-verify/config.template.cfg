# cc-tuner smoke-verify config (KEY=VALUE, parsed by bash — no quotes needed).
# Presence of this file opts THIS repo into the Stop-hook gate: a turn that
# changed files matching a rule below cannot end until that change is
# empirically exercised (or explicitly skipped) via scripts/smoke-verify/mark.sh.
# The gate sees the uncommitted delta only: verify and attest BEFORE committing.
#
# RULES. A screen, a migration and an endpoint are not proved the same way, so
# the gate is a list of rules rather than one pattern. Each is attested and
# released on its own with `mark.sh verified <rule> '<what you saw>'`; the name
# may be omitted when only one rule matches.
#
#   patterns.<rule>= grep -E regex over the repo-relative PATH of each changed
#                    file (staged, unstaged, untracked). ^ anchors to the start.
#   counts.<rule>=   what proves THIS kind of change. It goes verbatim into the
#                    message that blocks the agent, so write it in the imperative
#                    and name the tool: this text IS the standard.
#   excludes.<rule>= optional; added to the universal refusals (typecheck, lint,
#                    an already-green suite, "the diff looks correct").
#
# DELETE the rules below that do not apply here and add the ones that do. A rule
# whose `counts` you cannot write concretely is a rule you do not yet know how
# to verify — worth noticing before it is worth configuring.

# cap: max blocks per unchanged delta, per rule, before the gate fails open (1-99).
cap=3

patterns.ui=\.(tsx|jsx|vue|svelte)$
counts.ui=open the affected page or flow in a browser you drive (chrome-devtools MCP, Playwright, or the app's own e2e runner), interact with it, and say what changed on screen
excludes.ui=a snapshot test, or a story that renders in isolation and was already green

patterns.migration=(^|/)(migrations|alembic|db/migrate)/
counts.migration=apply the migration and roll it back against a scratch copy of the schema, and show the schema diff either way
excludes.migration=the ORM generated it, or the SQL reads correctly

# The extension list matters more than the directory list: SvelteKit's
# `src/routes/+page.svelte` and Remix's `app/routes/home.tsx` live under a
# routes/ directory and are UI, not endpoints. Matching the directory alone puts
# them in this rule as well, and the gate then demands an HTTP request as proof
# of a component — which nobody can give, so the turn blocks to the cap.
patterns.api=(^|/)(routes|routers|handlers|controllers|adapters)/.*\.(ts|js|py|rb|go|rs|java|kt|php)$
counts.api=send a real request to the running service through the changed path and show the status code and the body
excludes.api=a unit test against a mocked transport

# UPGRADING from the pre-rules form? A bare `patterns=` is still read, as the
# rule named `default`, on its old state paths — but with no `counts.default=`
# it falls back to a generic demand that is weaker than the text the gate used
# to ship. Add `counts.default=` saying what proves a change here, or split into
# named rules. A rule with no `counts` says so in its own block message.
