# cc-tuner smoke-verify config (KEY=VALUE, parsed by bash — no quotes needed).
# Presence of this file opts THIS repo into the Stop-hook gate: a turn that
# changed files matching a rule below cannot end until that change is
# empirically exercised (or explicitly skipped) via scripts/smoke-verify/mark.sh.
# The gate sees the uncommitted delta only: verify and attest BEFORE committing.
#
# RULES. A repository has more than one kind of change worth exercising, and
# they are not proved the same way — a screen is proved in a browser, a
# migration by running it up and back, an endpoint by a real request. So the
# gate is a list of rules rather than one pattern:
#
#   patterns.<rule>=extended regex (grep -E) matched against the repo-relative
#                   PATH of every uncommitted changed file (staged, unstaged,
#                   untracked). ^ anchors to the path start.
#   counts.<rule>=  what proves THIS kind of change. It is written into the block
#                   message the agent receives, so put it in the imperative and
#                   name the tool: this text IS the standard, not a pointer to it.
#   excludes.<rule>=what someone will try to pass off as proof here. Optional;
#                   appended to the universal list (typecheck, lint, a suite that
#                   was already green, "the diff looks correct").
#
# Each rule is attested and released on its own:
#   mark.sh verified <rule> '<what you exercised and what it showed>'
# The rule name may be omitted when only one rule matches the current delta.
#
# DELETE the rules that do not apply here and add the ones that do. A rule whose
# `counts` you cannot write concretely is a rule you do not yet know how to
# verify — worth noticing before it is worth configuring.

# cap: max blocks per unchanged delta, per rule, before the gate fails open (1-99).
cap=3

patterns.ui=\.(tsx|jsx|vue|svelte)$
counts.ui=open the affected page or flow through chrome-devtools MCP (navigate, interact, screenshot) and confirm the changed behaviour on screen
excludes.ui=a snapshot test, or a story that renders in isolation and was already green

patterns.migration=(^|/)(migrations|alembic|db/migrate)/
counts.migration=apply the migration and roll it back against a scratch copy of the schema, and show the schema diff either way
excludes.migration=the ORM generated it, or the SQL reads correctly

patterns.api=(^|/)(routes|routers|handlers|controllers|adapters)/
counts.api=send a real request to the running service through the changed path and show the status code and the body
excludes.api=a unit test against a mocked transport

# The pre-rules form is still read, as the rule named `default`:
#   patterns=\.(tsx|jsx|css|scss)$
# It works, and it is what an install from before rules looks like. Prefer named
# rules: `default` can only carry one evidence list for the whole repository.
