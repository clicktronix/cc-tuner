name: release-please

on:
  push:
    branches: [main]
  # Re-validates the open release PR by hand; a re-run of a push run does the same.
  workflow_dispatch:

# The action maintains the release PR with GITHUB_TOKEN. Because that PR may not trigger ordinary CI,
# this workflow validates its exact head SHA and publishes an explicit commit status itself.
permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Resolve release PR head
        id: release-pr
        # In release-please-action v4, prs_created is true when a release PR is created or updated.
        # A re-run or a manual run leaves the PR as it is, so prs_created is false there and the
        # open release PR is looked up instead: otherwise a failed first attempt could never be
        # validated again.
        env:
          GH_TOKEN: ${{ github.token }}
          CREATED: ${{ steps.release.outputs.prs_created }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
          RECHECK: ${{ github.run_attempt != '1' || github.event_name == 'workflow_dispatch' }}
        run: |
          number=""
          sha=""
          if [ "$CREATED" = true ]; then
            number="$(printf '%s' "$RELEASE_PR" | jq -er '.number')"
            sha="$(printf '%s' "$RELEASE_PR" | jq -er '.sha // empty' || true)"
          elif [ "$RECHECK" = true ]; then
            number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head release-please--branches--main \
              --json number --jq '.[0].number // empty')"
          fi
          [ -n "$number" ] || exit 0
          if [ -z "$sha" ]; then
            sha="$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          fi
          printf 'number=%s\nsha=%s\n' "$number" "$sha" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$sha" \
            -f state=pending \
            -f context=release-pr/validate \
            -f description='Validating generated release changes'

      - name: Check out release PR head
        if: ${{ steps.release-pr.outputs.sha != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release-pr.outputs.sha }}
          persist-credentials: false
          # tests/run.sh compares the accepted production surface with EVALUATED_SHA.
          fetch-depth: 0

      - name: Install the pinned Claude Code
        # tests/run.sh validates and tests the hooks module with the claude CLI, as validate.yml does.
        if: ${{ steps.release-pr.outputs.sha != '' }}
        run: npm install -g @anthropic-ai/claude-code@"$(cat plugins/cc-tuner/tests/flow/CLAUDE_CODE_VERSION)"

      - name: Validate release PR
        id: validate-release
        if: ${{ steps.release-pr.outputs.sha != '' }}
        continue-on-error: true
        run: bash tests/run.sh

      - name: Publish release PR validation
        if: ${{ always() && steps.release-pr.outputs.sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.validate-release.outcome }}
          SHA: ${{ steps.release-pr.outputs.sha }}
        run: |
          state=success
          description='Generated release changes passed validation'
          if [ "$OUTCOME" != success ]; then
            state=failure
            description='Generated release changes failed validation'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" \
            -f context=release-pr/validate \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          [ "$state" = success ]
