name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/run.sh compares the accepted production surface with EVALUATED_SHA.
          fetch-depth: 0
      - run: bash tests/run.sh
